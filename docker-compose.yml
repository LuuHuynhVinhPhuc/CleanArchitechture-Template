services:
  clean-arch-api:
    image: clean-arch-template-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-5000}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=CleanArchDb;Username=postgres;Password=postgres;GSS Encryption Mode=Disable
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  # One-shot job: applies EF Core migrations and seeds data, then exits.
  migrator:
    image: clean-arch-template-migrator
    build:
      context: .
      dockerfile: CleanArch.MigratorDB/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=CleanArchDb;Username=postgres;Password=postgres;GSS Encryption Mode=Disable
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: CleanArchDb
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
